services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
      POSTGRES_DB: aegis
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aegis']
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - aegis-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 15

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - '6006:6006'
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - aegis-phoenix:/data

volumes:
  aegis-postgres:
  aegis-phoenix:
