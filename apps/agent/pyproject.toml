[project]
name = "aegis-agent"
version = "0.0.0"
description = "LangGraph agent that reaches MCP tools through the Aegis gateway"
requires-python = ">=3.13,<3.14"
dependencies = [
    "langchain-anthropic>=1.7.1",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mcp>=2.2.0",
    "psycopg[binary,pool]>=3.3.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_agent"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
