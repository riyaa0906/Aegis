[project]
name = "aegis-classifier"
version = "0.0.0"
description = "Local prompt-injection classifier for Aegis tool output"
requires-python = ">=3.13,<3.14"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32", "transformers>=4.46", "torch>=2.5"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_classifier"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
